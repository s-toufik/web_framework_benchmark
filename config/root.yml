application_configuration:
  env: ${oc.env:APP_ENV,debug}
  run: async
  log: ${oc.env:LOG_LEVEL,WARNING}

  server:
    asgi:
      shop: ${server.shop}

  connector:
    database:
      shop_db: ${connector.shop_db}
    api:
      inventory: ${connector.inventory}
      pricing: ${connector.pricing}
      market: ${connector.market}

  operation:
    inventory_stock: ${operation.inventory_stock}
    pricing_quote: ${operation.pricing_quote}
    market_ticks: ${operation.market_ticks}
